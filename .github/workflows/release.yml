name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: "Windows"
            runner: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: ""
            sidecar_name: "yt-dlp-x86_64-pc-windows-msvc.exe"
            sidecar_url: "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
            ffmpeg_name: "ffmpeg-x86_64-pc-windows-msvc.exe"
            ffmpeg_url: "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-win32-x64.exe"
          - name: "macOS (Apple Silicon)"
            runner: "macos-latest"
            target: "aarch64-apple-darwin"
            # Skip Tauri's DMG bundler (`bundle_dmg.sh`) — it's flaky on GitHub
            # Actions macOS runners and fails within seconds with no useful
            # error. We zip the .app ourselves in a later step.
            args: "--target aarch64-apple-darwin --bundles app"
            sidecar_name: "yt-dlp-aarch64-apple-darwin"
            sidecar_url: "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos"
            ffmpeg_name: "ffmpeg-aarch64-apple-darwin"
            ffmpeg_url: "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-arm64"
          - name: "macOS (Intel)"
            # Cross-compile the Intel build on an Apple Silicon runner. Native
            # Intel runners (macos-13) are being retired and are scarce; the
            # macOS toolchain is universal, so an arm64 host links x86_64 fine
            # given the Rust target (installed below) and `--target` flag.
            runner: "macos-latest"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin --bundles app"
            sidecar_name: "yt-dlp-x86_64-apple-darwin"
            sidecar_url: "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos"
            ffmpeg_name: "ffmpeg-x86_64-apple-darwin"
            ffmpeg_url: "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-x64"
          - name: "Linux"
            runner: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: ""
            sidecar_name: "yt-dlp-x86_64-unknown-linux-gnu"
            sidecar_url: "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux"
            ffmpeg_name: "ffmpeg-x86_64-unknown-linux-gnu"
            ffmpeg_url: "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-linux-x64"

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - name: Download yt-dlp sidecar (Unix)
        if: matrix.platform.runner != 'windows-latest'
        run: |
          mkdir -p src-tauri/binaries
          curl -L --fail -o "src-tauri/binaries/${{ matrix.platform.sidecar_name }}" "${{ matrix.platform.sidecar_url }}"
          chmod +x "src-tauri/binaries/${{ matrix.platform.sidecar_name }}"

      - name: Download yt-dlp sidecar (Windows)
        if: matrix.platform.runner == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          Invoke-WebRequest -Uri "${{ matrix.platform.sidecar_url }}" -OutFile "src-tauri/binaries/${{ matrix.platform.sidecar_name }}"

      - name: Download ffmpeg sidecar (Unix)
        if: matrix.platform.runner != 'windows-latest'
        run: |
          mkdir -p src-tauri/binaries
          curl -L --fail -o "src-tauri/binaries/${{ matrix.platform.ffmpeg_name }}" "${{ matrix.platform.ffmpeg_url }}"
          chmod +x "src-tauri/binaries/${{ matrix.platform.ffmpeg_name }}"

      - name: Download ffmpeg sidecar (Windows)
        if: matrix.platform.runner == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          Invoke-WebRequest -Uri "${{ matrix.platform.ffmpeg_url }}" -OutFile "src-tauri/binaries/${{ matrix.platform.ffmpeg_name }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cargo cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.platform.target }}

      - name: npm install
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.platform.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('VidMinder {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: false

      - name: Package macOS .app as zip
        if: startsWith(matrix.platform.runner, 'macos')
        id: zip_mac
        run: |
          APP_DIR="src-tauri/target/${{ matrix.platform.target }}/release/bundle/macos"
          if [ ! -d "$APP_DIR/VidMinder.app" ]; then
            echo "VidMinder.app missing in $APP_DIR — listing:"
            ls -la "$APP_DIR" || true
            exit 1
          fi
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="dev"; fi
          ZIP_NAME="VidMinder_${VERSION}_${{ matrix.platform.target }}.app.zip"
          # `ditto -c -k --keepParent` produces a zip that preserves macOS
          # metadata and decompresses to VidMinder.app cleanly.
          (cd "$APP_DIR" && ditto -c -k --sequesterRsrc --keepParent "VidMinder.app" "$ZIP_NAME")
          echo "zip_path=$APP_DIR/$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Attach macOS .app.zip to release
        if: startsWith(matrix.platform.runner, 'macos') && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "${{ steps.zip_mac.outputs.zip_path }}" --clobber

      # Upload stable-named asset copies (no embedded version number) so the
      # README can link to /releases/latest/download/VidMinder-windows.msi
      # and have it keep working across version bumps. Each runner uploads
      # only its own platform's copies — runs are parallel; --clobber handles
      # rare reuploads on re-runs.
      - name: Upload stable-named copies (Windows)
        if: matrix.platform.runner == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/" -Filter "*.msi" | Select-Object -First 1
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/" -Filter "*-setup.exe" | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName "VidMinder-windows.msi"
            gh release upload $tag "VidMinder-windows.msi" --clobber
          }
          if ($exe) {
            Copy-Item $exe.FullName "VidMinder-windows-setup.exe"
            gh release upload $tag "VidMinder-windows-setup.exe" --clobber
          }

      - name: Upload stable-named copies (macOS)
        if: startsWith(matrix.platform.runner, 'macos') && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          TARGET="${{ matrix.platform.target }}"
          SRC="${{ steps.zip_mac.outputs.zip_path }}"
          if [ "$TARGET" = "aarch64-apple-darwin" ]; then
            DEST="VidMinder-macos-arm64.app.zip"
          else
            DEST="VidMinder-macos-intel.app.zip"
          fi
          cp "$SRC" "$DEST"
          gh release upload "$TAG" "$DEST" --clobber

      - name: Upload stable-named copies (Linux)
        if: matrix.platform.runner == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null | head -1)
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb 2>/dev/null | head -1)
          RPM=$(ls src-tauri/target/release/bundle/rpm/*.rpm 2>/dev/null | head -1)
          if [ -n "$APPIMAGE" ]; then
            cp "$APPIMAGE" VidMinder-linux.AppImage
            gh release upload "$TAG" VidMinder-linux.AppImage --clobber
          fi
          if [ -n "$DEB" ]; then
            cp "$DEB" VidMinder-linux.deb
            gh release upload "$TAG" VidMinder-linux.deb --clobber
          fi
          if [ -n "$RPM" ]; then
            cp "$RPM" VidMinder-linux.rpm
            gh release upload "$TAG" VidMinder-linux.rpm --clobber
          fi

      - name: Upload Windows installer artifact
        if: matrix.platform.runner == 'windows-latest' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: VidMinder-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 1

      - name: Upload macOS artifact (push to main)
        if: startsWith(matrix.platform.runner, 'macos') && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: VidMinder-${{ matrix.platform.target }}
          path: ${{ steps.zip_mac.outputs.zip_path }}
          if-no-files-found: warn
          retention-days: 1

      - name: Upload Linux artifact
        if: matrix.platform.runner == 'ubuntu-22.04' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: VidMinder-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 1

  # Keep GitHub storage minimal: after a tagged release builds, delete every
  # OLDER release (and its binary assets), leaving only the newest. Git tags are
  # kept (they're tiny) so version history survives and /releases/latest works.
  prune-old-releases:
    name: Prune old releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete all but the most recent release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh release list --repo "$REPO" --limit 200 --json tagName,createdAt \
            | jq -r 'sort_by(.createdAt) | reverse | .[1:] | .[].tagName' \
            | while read -r tag; do
                [ -z "$tag" ] && continue
                echo "Deleting old release: $tag"
                gh release delete "$tag" --repo "$REPO" --yes
              done
