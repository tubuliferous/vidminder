name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: "Windows"
            runner: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: ""
            sidecar_name: "yt-dlp-x86_64-pc-windows-msvc.exe"
            sidecar_url: "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          - name: "macOS (Apple Silicon)"
            runner: "macos-latest"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
            sidecar_name: "yt-dlp-aarch64-apple-darwin"
            sidecar_url: "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos"
          - name: "macOS (Intel)"
            runner: "macos-13"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
            sidecar_name: "yt-dlp-x86_64-apple-darwin"
            sidecar_url: "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos"
          - name: "Linux"
            runner: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: ""
            sidecar_name: "yt-dlp-x86_64-unknown-linux-gnu"
            sidecar_url: "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux"

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - name: Download yt-dlp sidecar (Unix)
        if: matrix.platform.runner != 'windows-latest'
        run: |
          mkdir -p src-tauri/binaries
          curl -L --fail -o "src-tauri/binaries/${{ matrix.platform.sidecar_name }}" "${{ matrix.platform.sidecar_url }}"
          chmod +x "src-tauri/binaries/${{ matrix.platform.sidecar_name }}"

      - name: Download yt-dlp sidecar (Windows)
        if: matrix.platform.runner == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          Invoke-WebRequest -Uri "${{ matrix.platform.sidecar_url }}" -OutFile "src-tauri/binaries/${{ matrix.platform.sidecar_name }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cargo cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.platform.target }}

      - name: npm install
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.platform.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('VidMinder {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      - name: Upload Windows installer artifact
        if: matrix.platform.runner == 'windows-latest' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: VidMinder-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 7

      - name: Upload macOS artifact
        if: startsWith(matrix.platform.runner, 'macos') && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: VidMinder-${{ matrix.platform.target }}
          path: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Linux artifact
        if: matrix.platform.runner == 'ubuntu-22.04' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: VidMinder-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 7
